<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing Lasts Forever</title>
    <link rel="stylesheet" href="css/page2.css">
</head>

<body>
    <main class="experience">

        <section class="words">
            <button class="memory">Money</button>
            <button class="memory">Love</button>
            <button class="memory">Beauty</button>
            <button class="memory">Health</button>
            <button class="memory">Family</button>
            <button class="memory">Youth</button>
            <button class="memory">Memories</button>
            <button class="memory">Happiness</button>
            <button class="memory">Sadness</button>
            <button class="memory">Time</button>
            <button class="memory">Life</button>
            <button class="memory">Status</button>
            <button class="memory">Success</button>
            <button class="memory">Failure</button>
            <button class="memory">Friends</button>
            <button class="memory">Enemies</button>
            <button class="memory">power</button>
            <button class="memory">Identity</button>
            <button class="memory">Ego</button>
            <button class="memory">Power</button>
            <button class="memory">Control</button>
            <button class="memory">Dreams</button>
            <button class="memory">Hope</button>
            <button class="memory">Freedom</button>
            <button class="memory">Peace</button>
            <button class="memory">Legacy</button>
            <button class="memory">Existence</button>

        </section>

        <audio id="endingsound" preload="auto">
            <source src="audio/final.mp3" type="audio/mpeg">
        </audio>
        <!-- Background Music -->
        <audio id="backgroundmusic" loop>
            <source src="audio/pressure.mp3" type="audio/mpeg">
        </audio>

        <!-- Warning Sound Effect -->
        <audio id="warningsound">
            <source src="audio/bell.mp3" type="audio/mpeg">
        </audio>


        <!-- Golden dust particles -->
        <canvas id="particleCanvas"></canvas>

        <!-- Time warning -->
        <p id="warningbox" class="warning-box">
            Time is slipping away...
        </p>

        <button id="ending" class="ending" type="button">
        <span id="ending-text"></span>
        </button>

    </main>
</body>
<script src="js/page2.js" defer></script>

</html>
